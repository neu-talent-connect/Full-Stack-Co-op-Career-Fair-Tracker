name: CI

on:
  push:
    branches: [ 'deploy/vercel', 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Run basic health-check (unitless)
        run: |
          echo "Build finished; health-check endpoint exists in app/api/health/route.ts"
