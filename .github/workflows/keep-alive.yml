name: Keep Supabase Awake

# Supabase pauses free-tier projects after 7 days with NO database queries.
# This job hits /api/health once a day. That route runs prisma.job.count()
# (a real DB query), which resets the inactivity timer so the project never
# pauses. Scheduled cron + a manual "Run workflow" button.

on:
  schedule:
    # 06:17 UTC daily (off the hour — GitHub delays jobs scheduled on the hour).
    - cron: '17 6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Curl /api/health
        env:
          # Set this to your deployed health URL, e.g.
          # https://your-app.vercel.app/api/health
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::HEALTH_URL repo variable is not set. Add it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          echo "Pinging $HEALTH_URL"
          # -sS: quiet but show errors. Write the HTTP status to a separate line.
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 "$HEALTH_URL")

          echo "HTTP status: $status"
          echo "----- response body -----"
          cat response.json || true
          echo ""
          echo "--------------------------"

          if [ "$status" != "200" ]; then
            echo "::error::Health check returned $status (expected 200). Supabase may be paused or the app is down."
            exit 1
          fi

          echo "Health check OK — database was queried, inactivity timer reset."
